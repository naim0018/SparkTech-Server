services:
  sparktech-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_USER:-mdkazinaim}/sparktech-server:latest
    container_name: sparktech-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
